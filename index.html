<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Loop Racing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="game"></canvas>

      <section id="homeScreen" class="screen is-active" aria-label="Home menu">
        <div class="menu-panel">
          <p class="kicker">Three.js Circuit</p>
          <h1>Turbo Loop Racing</h1>
          <button id="startButton" class="primary-button">Start</button>
        </div>
      </section>

      <section id="mapScreen" class="screen" aria-label="Map select">
        <div class="menu-panel">
          <p class="kicker">Choose Map</p>
          <h2>Neon Oval</h2>
          <button id="mapButton" class="map-card">
            <span class="map-preview" aria-hidden="true"></span>
            <span>Race Neon Oval</span>
          </button>
        </div>
      </section>

      <div id="countdown" class="countdown" aria-live="polite"></div>

      <div id="hud" class="hud" aria-live="polite">
        <div class="hud-block">
          <span>Lap</span>
          <strong id="lapText">1 / 3</strong>
        </div>
        <div class="hud-block">
          <span>Speed</span>
          <strong id="speedText">0</strong>
        </div>
        <div class="hud-block boost-meter">
          <span>Boost</span>
          <strong id="boostText">Ready</strong>
        </div>
      </div>

      <aside id="leaderboard" class="leaderboard" aria-label="Leaderboard">
        <h2>Leaderboard</h2>
        <ol id="leaderList"></ol>
      </aside>

      <div id="raceMessage" class="race-message"></div>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
